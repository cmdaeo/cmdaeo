    <use href="#miniTri" x="575" y="30"/>
    <use href="#miniTri" x="625" y="30"/>
    <use href="#miniTri" x="675" y="30"/>
    <use href="#miniTri" x="725" y="30"/>
    <use href="#miniTri" x="775" y="30"/>
    <use href="#miniTri" x="825" y="30"/>
    <use href="#miniTri" x="875" y="30"/>
    <use href="#miniTri" x="925" y="30"/>
    <use href="#miniTri" x="975" y="30"/>
    <use href="#miniTri" x="1025" y="30"/>
    <use href="#miniTri" x="1075" y="30"/>
    <use href="#miniTri" x="1125" y="30"/>
