<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#a020f0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </linearGradient>
    <g id="miniTri">
      <polygon points="0,-12 -10,7 10,7" fill="none" stroke="url(#divGrad)" stroke-width="1.5"/>
      <polygon points="0,-12 -10,7 10,7" fill="url(#divGrad)" opacity="0.15"/>
    </g>
  </defs>
  <rect width="1200" height="60" fill="#0a0a0c"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="50 0" dur="3s" repeatCount="indefinite"/>
    <use href="#miniTri" x="25" y="30"/>
    <use href="#miniTri" x="75" y="30"/>
    <use href="#miniTri" x="125" y="30"/>
    <use href="#miniTri" x="175" y="30"/>
    <use href="#miniTri" x="225" y="30"/>
