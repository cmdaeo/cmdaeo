<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a020f0" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </linearGradient>
    <filter id="knotGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="40" fill="#0a0a0c"/>

  <path d="M 0 20 L 530 20 M 670 20 L 1200 20" stroke="url(#lineGrad)" stroke-width="1" />
  <path d="M 0 20 L 530 20 M 670 20 L 1200 20" stroke="url(#lineGrad)" stroke-width="3" opacity="0.2" filter="url(#knotGlow)"/>

  <g transform="translate(600 20)">
    <path d="M -50 0 C -50 -20 -10 -20 0 0 C 10 20 50 20 50 0 C 50 -20 10 -20 0 0 C -10 20 -50 20 -50 0 Z"
          fill="none" stroke="url(#lineGrad)" stroke-width="2" filter="url(#knotGlow)">
      <animate attributeName="stroke-dasharray" values="0 300;300 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="3" fill="#00e5ff" filter="url(#knotGlow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M -50 0 C -50 -20 -10 -20 0 0 C 10 20 50 20 50 0 C 50 -20 10 -20 0 0 C -10 20 -50 20 -50 0 Z"/>
    </circle>
  </g>
</svg>
