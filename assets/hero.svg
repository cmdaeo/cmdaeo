                  M-166,-166 L166,-166 L166,166 L-166,166 Z" />
        <animate attributeName="stroke" values="#ff1e8a;#8b5cf6;#00f0ff;#ff1e8a" dur="6s" repeatCount="indefinite" />
      </path>

      <path fill="#8b5cf6" fill-opacity="0.015" stroke="#8b5cf6" stroke-width="1.9" stroke-linejoin="round" d="M-128,-74 L64,-74 L64,118 L-128,118 Z">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-128,-74 L64,-74 L64,118 L-128,118 Z;
                  M-89,-50 L43,-50 L43,82 L-89,82 Z;
