<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%">
  <defs>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"><animate attributeName="stop-color" values="#ff0066;#00e5ff;#a020f0;#00ff88;#ff0066" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="50%"><animate attributeName="stop-color" values="#00e5ff;#a020f0;#ff0066;#00e5ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%"><animate attributeName="stop-color" values="#a020f0;#ff0066;#00ff88;#a020f0" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>

    <filter id="warpGrid" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="5" result="noise">
        <animate attributeName="baseFrequency" values="0.008 0.012;0.015 0.02;0.008 0.012" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="seed" values="5;12;3;5" dur="30s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    </pattern>

    <filter id="glitchText" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="noise">
        <animate attributeName="baseFrequency" values="0.9;1.4;0.9" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="seed" values="3;7;2;3" dur="0.8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="#0a0a0c"/>
  <g filter="url(#warpGrid)" opacity="0.35">
    <rect width="1200" height="500" fill="url(#grid)"/>
  </g>

  <g transform="translate(600 250)" opacity="0.2">
    <ellipse rx="480" ry="220" fill="none" stroke="#ff0066" stroke-width="0.5">
      <animate attributeName="rx" values="480;520;480" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#ff0066;#00e5ff;#a020f0;#ff0066" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="420" ry="190" fill="none" stroke="#00e5ff" stroke-width="0.5">
      <animate attributeName="rx" values="420;450;420" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="360" ry="160" fill="none" stroke="#a020f0" stroke-width="0.5">
      <animate attributeName="rx" values="360;385;360" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g transform="translate(600 250)">
    <g>
      <polygon points="0,-110 -95,55 95,55" fill="url(#triGrad)" opacity="0.12">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-110 -95,55 95,55" fill="none" stroke="url(#triGrad)" stroke-width="2.5" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g>
      <polygon points="0,-110 -95,55 95,55" fill="none" stroke="url(#triGrad)" stroke-width="2.5" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="25s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g>
      <polygon points="0,-110 -95,55 95,55" fill="none" stroke="url(#triGrad)" stroke-width="2.5" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="20s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <g filter="url(#glitchText)" opacity="0.35">
    <text x="604" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="66" font-weight="900" letter-spacing="12" fill="#ff0066">MIGUEL MACEDO</text>
  </g>
  <text x="600" y="254" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="66" font-weight="900" letter-spacing="12" fill="#ffffff" filter="url(#glow)">MIGUEL MACEDO</text>
  <text x="600" y="308" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="8" fill="#ffffff" opacity="0.75">FULL-STACK · AI-AUGMENTED · IOT</text>

  <path d="M 24 24 L 60 24 M 24 24 L 24 60" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 1176 24 L 1140 24 M 1176 24 L 1176 60" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 24 476 L 60 476 M 24 476 L 24 440" stroke="#ff0066" stroke-width="1.5" opacity="0.7"/>
  <path d="M 1176 476 L 1140 476 M 1176 476 L 1176 440" stroke="#ff0066" stroke-width="1.5" opacity="0.7"/>

  <circle cx="600" cy="140" r="3" fill="#00e5ff">
    <animate attributeName="cx" values="600;900;600;300;600" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;250;360;250;140" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="250" r="2" fill="#ff0066">
    <animate attributeName="cx" values="300;600;900;600;300" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="250;140;250;360;250" dur="15s" repeatCount="indefinite"/>
  </circle>
</svg>
