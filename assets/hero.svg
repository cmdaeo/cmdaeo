<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <linearGradient id="topRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <clipPath id="reelClip">
      <rect x="0" y="-22" width="110" height="28" />
    </clipPath>

    <style type="text/css">
      
        .bg-canvas { fill: #0d1117; stroke: #1e293b; }
        .card-box { fill: #111827; stroke: #1e293b; }
        .txt-main { fill: #f8fafc; }
        .txt-muted { fill: #64748b; }
        .theme-label { fill: #818cf8; }

        @media (prefers-color-scheme: light) {
          .bg-canvas { fill: #ffffff; stroke: #e2e8f0; }
          .card-box { fill: #f8fafc; stroke: #cbd5e1; }
          .txt-main { fill: #0f172a; }
          .txt-muted { fill: #64748b; }
        }

        @keyframes cssDot {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.25; transform: scale(0.8); }
        }
        .css-probe {
          transform-box: fill-box;
          transform-origin: center;
          animation: cssDot 1.6s ease-in-out infinite;
          fill: #38bdf8;
        }
      
    </style>
  </defs>

  <rect width="1200" height="340" rx="10" class="bg-canvas" stroke-width="1" />

  <g transform="translate(600, 42)" font-family="ui-monospace, SFMono-Regular, &#39;JetBrains Mono&#39;, Consolas, monospace">
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="700" class="txt-main" letter-spacing="4">
      GITHUB SANITIZER-SAFE CAPABILITY PROBE
    </text>
    <text x="0" y="18" text-anchor="middle" font-size="9.5" class="txt-muted" letter-spacing="2">
      ZERO SCRIPT TAGS · FIXED VIEWPORT · TESTING CSS, MEDIA QUERIES & SMIL REELS
    </text>
  </g>
  <line x1="40" y1="72" x2="1160" y2="72" stroke="url(#topRule)" stroke-width="1" />

  <!-- TEST 01: CSS @keyframes -->
  <g transform="translate(40, 92)">
    <rect width="545" height="96" rx="6" class="card-box" stroke-width="1" />
    <text x="16" y="24" font-family="monospace" font-size="10.5" font-weight="600" fill="#38bdf8">TEST-01 // <style> CSS @keyframes Animation</text>
    <circle cx="26" cy="55" r="7" class="css-probe" />
    <text x="44" y="60" font-family="monospace" font-size="15" font-weight="600" class="txt-main">PULSING DOT = CSS SURVIVED</text>
    <text x="16" y="82" font-family="monospace" font-size="9" class="txt-muted">Verifies whether inline <style> keyframes run inside GitHub's proxy</text>
  </g>

  <!-- TEST 02: Dynamic OS Light/Dark Mode -->
  <g transform="translate(615, 92)">
    <rect width="545" height="96" rx="6" class="card-box" stroke-width="1" />
    <text x="16" y="24" font-family="monospace" font-size="10.5" font-weight="600" fill="#818cf8">TEST-02 // @media (prefers-color-scheme) Detection</text>
    <text x="16" y="60" font-family="monospace" font-size="15" font-weight="600" class="theme-label">AUTO-ADAPTS TO VIEWER SYSTEM THEME</text>
    <text x="16" y="82" font-family="monospace" font-size="9" class="txt-muted">Card background & text invert dynamically when GitHub switches Light/Dark</text>
  </g>

  <!-- TEST 03: Pure SMIL Discrete Ticking Clock -->
  <g transform="translate(40, 206)">
    <rect width="545" height="96" rx="6" class="card-box" stroke-width="1" />
    <text x="16" y="24" font-family="monospace" font-size="10.5" font-weight="600" fill="#10b981">TEST-03 // SMIL calcMode="discrete" Live Reels (MM:SS)</text>

    <g transform="translate(16, 64)" clip-path="url(#reelClip)" font-family="monospace" font-size="26" font-weight="700">
      <g class="txt-main">
        <animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="600s" repeatCount="indefinite" values="0 0; 0 -30; 0 -60; 0 -90; 0 -120; 0 -150; 0 -180; 0 -210; 0 -240; 0 -270" />
        <text x="0" y="0">0</text><text x="0" y="30">1</text><text x="0" y="60">2</text><text x="0" y="90">3</text><text x="0" y="120">4</text>
        <text x="0" y="150">5</text><text x="0" y="180">6</text><text x="0" y="210">7</text><text x="0" y="240">8</text><text x="0" y="270">9</text>
      </g>
      <text x="18" y="-1" fill="#818cf8">:</text>
      <g fill="#818cf8">
        <animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="60s" repeatCount="indefinite" values="0 0; 0 -30; 0 -60; 0 -90; 0 -120; 0 -150" />
        <text x="34" y="0">0</text><text x="34" y="30">1</text><text x="34" y="60">2</text><text x="34" y="90">3</text><text x="34" y="120">4</text><text x="34" y="150">5</text>
      </g>
      <g fill="#38bdf8">
        <animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="10s" repeatCount="indefinite" values="0 0; 0 -30; 0 -60; 0 -90; 0 -120; 0 -150; 0 -180; 0 -210; 0 -240; 0 -270" />
        <text x="52" y="0">0</text><text x="52" y="30">1</text><text x="52" y="60">2</text><text x="52" y="90">3</text><text x="52" y="120">4</text>
        <text x="52" y="150">5</text><text x="52" y="180">6</text><text x="52" y="210">7</text><text x="52" y="240">8</text><text x="52" y="270">9</text>
      </g>
    </g>
    <text x="16" y="82" font-family="monospace" font-size="9" class="txt-muted">Ticks upward every second purely via SVG SMIL without JavaScript</text>
  </g>

  <!-- TEST 04: SMIL Smooth Path Morph -->
  <g transform="translate(615, 206)">
    <rect width="545" height="96" rx="6" class="card-box" stroke-width="1" />
    <text x="16" y="24" font-family="monospace" font-size="10.5" font-weight="600" fill="#c084fc">TEST-04 // SMIL Bezier Wave Interpolation</text>
    <path d="M 16 55 Q 150 38, 280 55 T 525 55" stroke="#c084fc" stroke-width="1.5" fill="none">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" values="M 16 55 Q 150 38, 280 55 T 525 55;
                M 16 55 Q 150 72, 280 55 T 525 55;
                M 16 55 Q 150 38, 280 55 T 525 55" />
    </path>
    <text x="16" y="82" font-family="monospace" font-size="9" class="txt-muted">Smooth organic path interpolation without line-dash pulses</text>
  </g>
</svg>
