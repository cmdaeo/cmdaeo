  <g>
    <rect x="260" y="202" width="680" height="96" rx="4" fill="#0a0a0c" fill-opacity="0.82" />
    <line x1="260" y1="202" x2="940" y2="202" stroke="url(#border-grad)" stroke-width="1" />
    <line x1="260" y1="298" x2="940" y2="298" stroke="url(#border-grad)" stroke-width="1" />
    <path d="M 260 214 L 260 202 L 272 202 M 940 214 L 940 202 L 928 202 M 260 286 L 260 298 L 272 298 M 940 286 L 940 298 L 928 298" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
