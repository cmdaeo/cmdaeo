                  M-43,-82 L-115,-154 M89,-82 L161,-154 M89,50 L161,122 M-43,50 L-115,122;
                  M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166;
                  M-115,-154 L-161,-122 M161,-154 L115,-122 M161,122 L115,154 M-115,122 L-161,154;
                  M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118" />
        <animate attributeName="stroke" values="#00f0ff;#8b5cf6;#ff1e8a;#00f0ff" dur="8s" repeatCount="indefinite" />
      </path>

      <path fill="none" stroke="#8b5cf6" stroke-width="1.35" stroke-linecap="round" stroke-opacity="0.78" d="M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52;
                  M-89,-50 L-43,-82 M43,-50 L89,-82 M43,82 L89,50 M-89,82 L-43,50;
                  M-52,-52 L-64,-118 M52,-52 L128,-118 M52,52 L128,74 M-52,52 L-64,74;
                  M-43,-82 L-115,-154 M89,-82 L161,-154 M89,50 L161,122 M-43,50 L-115,122;
