<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Fluid, Desaturated Gradient Palette -->
    <linearGradient id="desat-rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" dur="18s" repeatCount="indefinite" values="#e09f9f; #bca3db; #9fb8e0; #9fd9e0; #aee09f; #e0d69f; #e0b99f; #e09f9f" />
      </stop>
      <stop offset="50%">
        <animate attributeName="stop-color" dur="18s" repeatCount="indefinite" values="#9fb8e0; #9fd9e0; #aee09f; #e0d69f; #e0b99f; #e09f9f; #bca3db; #9fb8e0" />
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" dur="18s" repeatCount="indefinite" values="#aee09f; #e0d69f; #e0b99f; #e09f9f; #bca3db; #9fb8e0; #9fd9e0; #aee09f" />
      </stop>
    </linearGradient>

    <style>
      /* Technical Typography */
      .txt-name {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 8px;
      }
      
      .txt-sub {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 4px;
      }

      /* Base Theme Text Defaults (Adapts for Light Mode) */
      .txt-name, .txt-sub { fill: #171717; }
      .divider { fill: #171717; opacity: 0.15; }
      
      /* Apply the dynamic gradient to all edges */
      .edge-1, .edge-2, .edge-3, .edge-4 { 
        stroke: url(#desat-rainbow); 
        fill: none;
        stroke-linecap: round;
      }
      /* Depth fading via opacity */
      .edge-1 { stroke-opacity: 0.90; stroke-width: 1.5px; }
      .edge-2 { stroke-opacity: 0.65; stroke-width: 1.5px; }
      .edge-3 { stroke-opacity: 0.45; stroke-width: 1.5px; }
      .edge-4 { stroke-opacity: 0.25; stroke-width: 1.5px; }
      
      /* Apply the gradient to the glass panes */
      .pane-1, .pane-2, .pane-3, .pane-4 { 
        fill: url(#desat-rainbow); 
        stroke: url(#desat-rainbow); 
        stroke-width: 1px;
        stroke-linejoin: round;
      }
      .pane-1 { fill-opacity: 0.04; stroke-opacity: 0.25; }
      .pane-2 { fill-opacity: 0.03; stroke-opacity: 0.20; }
      .pane-3 { fill-opacity: 0.02; stroke-opacity: 0.15; }
      .pane-4 { fill-opacity: 0.01; stroke-opacity: 0.10; }

      /* Dark Theme (Adapts automatically based on OS/Browser preference) */
      @media (prefers-color-scheme: dark) {
        .txt-name, .txt-sub { fill: #f5f5f5; }
        .divider { fill: #f5f5f5; opacity: 0.15; }
      }
    </style>
  </defs>

  <!-- The Tesseract Animation -->
  <g transform="translate(600, 190) scale(0.85)">
    <g>
      <!-- Slow rotation of the structure through the color gradient -->
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite" />

      <!-- Outer structural connections -->
      <path class="edge-1" d="M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166;
                  M-115,-154 L-161,-122 M161,-154 L115,-122 M161,122 L115,154 M-115,122 L-161,154;
                  M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118;
                  M-161,-122 L-89,-50 M115,-122 L43,-50 M115,154 L43,82 M-161,154 L-89,82;
                  M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52;
                  M-89,-50 L-43,-82 M43,-50 L89,-82 M43,82 L89,50 M-89,82 L-43,50;
                  M-52,-52 L-64,-118 M52,-52 L128,-118 M52,52 L128,74 M-52,52 L-64,74;
                  M-43,-82 L-115,-154 M89,-82 L161,-154 M89,50 L161,122 M-43,50 L-115,122;
                  M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166" />
      </path>

      <!-- Inner frame connections -->
      <path class="edge-2" d="M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118;
                  M-161,-122 L-89,-50 M115,-122 L43,-50 M115,154 L43,82 M-161,154 L-89,82;
                  M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52;
                  M-89,-50 L-43,-82 M43,-50 L89,-82 M43,82 L89,50 M-89,82 L-43,50;
                  M-52,-52 L-64,-118 M52,-52 L128,-118 M52,52 L128,74 M-52,52 L-64,74;
                  M-43,-82 L-115,-154 M89,-82 L161,-154 M89,50 L161,122 M-43,50 L-115,122;
                  M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166;
                  M-115,-154 L-161,-122 M161,-154 L115,-122 M161,122 L115,154 M-115,122 L-161,154;
                  M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118" />
      </path>

      <!-- Depth projection edges -->
      <path class="edge-3" d="M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52;
                  M-89,-50 L-43,-82 M43,-50 L89,-82 M43,82 L89,50 M-89,82 L-43,50;
                  M-52,-52 L-64,-118 M52,-52 L128,-118 M52,52 L128,74 M-52,52 L-64,74;
                  M-43,-82 L-115,-154 M89,-82 L161,-154 M89,50 L161,122 M-43,50 L-115,122;
                  M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166;
                  M-115,-154 L-161,-122 M161,-154 L115,-122 M161,122 L115,154 M-115,122 L-161,154;
                  M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118;
                  M-161,-122 L-89,-50 M115,-122 L43,-50 M115,154 L43,82 M-161,154 L-89,82;
                  M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52" />
      </path>

      <!-- Core structural edges -->
      <path class="edge-4" d="M-52,-52 L-64,-118 M52,-52 L128,-118 M52,52 L128,74 M-52,52 L-64,74">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-52,-52 L-64,-118 M52,-52 L128,-118 M52,52 L128,74 M-52,52 L-64,74;
                  M-43,-82 L-115,-154 M89,-82 L161,-154 M89,50 L161,122 M-43,50 L-115,122;
                  M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166;
                  M-115,-154 L-161,-122 M161,-154 L115,-122 M161,122 L115,154 M-115,122 L-161,154;
                  M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118;
                  M-161,-122 L-89,-50 M115,-122 L43,-50 M115,154 L43,82 M-161,154 L-89,82;
                  M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52;
                  M-89,-50 L-43,-82 M43,-50 L89,-82 M43,82 L89,50 M-89,82 L-43,50;
                  M-52,-52 L-64,-118 M52,-52 L128,-118 M52,52 L128,74 M-52,52 L-64,74" />
      </path>

      <!-- Glass-like transparent planar fills -->
      <path class="pane-1" d="M-64,-118 L128,-118 L128,74 L-64,74 Z">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-64,-118 L128,-118 L128,74 L-64,74 Z; M-115,-154 L161,-154 L161,122 L-115,122 Z; M-166,-166 L166,-166 L166,166 L-166,166 Z; M-161,-122 L115,-122 L115,154 L-161,154 Z; M-128,-74 L64,-74 L64,118 L-128,118 Z; M-89,-50 L43,-50 L43,82 L-89,82 Z; M-52,-52 L52,-52 L52,52 L-52,52 Z; M-43,-82 L89,-82 L89,50 L-43,50 Z; M-64,-118 L128,-118 L128,74 L-64,74 Z" />
      </path>

      <path class="pane-2" d="M-166,-166 L166,-166 L166,166 L-166,166 Z">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-166,-166 L166,-166 L166,166 L-166,166 Z; M-161,-122 L115,-122 L115,154 L-161,154 Z; M-128,-74 L64,-74 L64,118 L-128,118 Z; M-89,-50 L43,-50 L43,82 L-89,82 Z; M-52,-52 L52,-52 L52,52 L-52,52 Z; M-43,-82 L89,-82 L89,50 L-43,50 Z; M-64,-118 L128,-118 L128,74 L-64,74 Z; M-115,-154 L161,-154 L161,122 L-115,122 Z; M-166,-166 L166,-166 L166,166 L-166,166 Z" />
      </path>

      <path class="pane-3" d="M-128,-74 L64,-74 L64,118 L-128,118 Z">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-128,-74 L64,-74 L64,118 L-128,118 Z; M-89,-50 L43,-50 L43,82 L-89,82 Z; M-52,-52 L52,-52 L52,52 L-52,52 Z; M-43,-82 L89,-82 L89,50 L-43,50 Z; M-64,-118 L128,-118 L128,74 L-64,74 Z; M-115,-154 L161,-154 L161,122 L-115,122 Z; M-166,-166 L166,-166 L166,166 L-166,166 Z; M-161,-122 L115,-122 L115,154 L-161,154 Z; M-128,-74 L64,-74 L64,118 L-128,118 Z" />
      </path>

      <path class="pane-4" d="M-52,-52 L52,-52 L52,52 L-52,52 Z">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-52,-52 L52,-52 L52,52 L-52,52 Z; M-43,-82 L89,-82 L89,50 L-43,50 Z; M-64,-118 L128,-118 L128,74 L-64,74 Z; M-115,-154 L161,-154 L161,122 L-115,122 Z; M-166,-166 L166,-166 L166,166 L-166,166 Z; M-161,-122 L115,-122 L115,154 L-161,154 Z; M-128,-74 L64,-74 L64,118 L-128,118 Z; M-89,-50 L43,-50 L43,82 L-89,82 Z; M-52,-52 L52,-52 L52,52 L-52,52 Z" />
      </path>
    </g>
  </g>

  <!-- Technical Schematic Typography -->
  <text x="600" y="405" text-anchor="middle" class="txt-name">MIGUEL MACEDO</text>
  
  <rect x="350" y="430" width="500" height="1" class="divider" />
  
  <text x="600" y="460" text-anchor="middle" class="txt-sub">
    SOFTWARE | HARDWARE | EVERYTHING
  </text>
</svg>
