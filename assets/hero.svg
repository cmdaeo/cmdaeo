        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-166,-166 L166,-166 L166,166 L-166,166 Z;
                  M-161,-122 L115,-122 L115,154 L-161,154 Z;
                  M-128,-74 L64,-74 L64,118 L-128,118 Z;
