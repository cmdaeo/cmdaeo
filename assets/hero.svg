                  M-64,-118 L-166,-166 M128,-118 L166,-166 M128,74 L166,166 M-64,74 L-166,166" />
        <animate attributeName="stroke" values="#ff1e8a;#00f0ff;#8b5cf6;#ff1e8a" dur="8s" repeatCount="indefinite" />
      </path>

      <path fill="none" stroke="#00f0ff" stroke-width="1.35" stroke-linecap="round" stroke-opacity="0.78" d="M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118;
                  M-161,-122 L-89,-50 M115,-122 L43,-50 M115,154 L43,82 M-161,154 L-89,82;
