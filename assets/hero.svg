                  M-166,-166 L-128,-74 M166,-166 L64,-74 M166,166 L64,118 M-166,166 L-128,118;
                  M-161,-122 L-89,-50 M115,-122 L43,-50 M115,154 L43,82 M-161,154 L-89,82;
                  M-128,-74 L-52,-52 M64,-74 L52,-52 M64,118 L52,52 M-128,118 L-52,52" />
        <animate attributeName="stroke" values="#8b5cf6;#ff1e8a;#00f0ff;#8b5cf6" dur="8s" repeatCount="indefinite" />
