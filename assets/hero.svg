<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="70" fill="none">
  <defs>
    <linearGradient id="cleanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="48%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="52%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="600" cy="35" rx="160" ry="28" fill="url(#centerAura)" />

  <line x1="0" y1="35" x2="480" y2="35" stroke="url(#cleanLine)" stroke-width="1" />
  <line x1="720" y1="35" x2="1200" y2="35" stroke="url(#cleanLine)" stroke-width="1" />

  <circle cx="480" cy="35" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="720" cy="35" r="1.5" fill="#c084fc" opacity="0.4" />

  <g transform="translate(600, 35)" font-family="ui-monospace, SFMono-Regular, &#39;JetBrains Mono&#39;, Consolas, monospace">

    <text id="txt-date" x="0" y="-14" text-anchor="middle" font-size="9" fill="#94a3b8" letter-spacing="3" opacity="0.65">
      ---- . -- . --
    </text>

    <g font-size="22" font-weight="500" fill="#f8fafc">
      <text id="txt-hrs" x="-46" y="7" text-anchor="end" letter-spacing="1">00</text>

      <text x="-34" y="5" text-anchor="middle" fill="#818cf8" opacity="0.8">
        :
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite" />
      </text>

      <text id="txt-mins" x="-22" y="7" text-anchor="start" letter-spacing="1">00</text>

      <text x="24" y="5" text-anchor="middle" fill="#818cf8" opacity="0.8">
        :
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite" />
      </text>

      <text id="txt-secs" x="36" y="7" text-anchor="start" font-size="15" fill="#38bdf8" opacity="0.85" letter-spacing="1">00</text>
    </g>

    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#64748b" letter-spacing="7" opacity="0.6">
      MMXXVI · CMDAEO
    </text>
  </g>

  <script type="text/javascript">
    
      (function() {
        function update() {
          const now = new Date();
          const hrs = String(now.getHours()).padStart(2, '0');
          const mins = String(now.getMinutes()).padStart(2, '0');
          const secs = String(now.getSeconds()).padStart(2, '0');

          const elHrs = document.getElementById('txt-hrs');
          const elMins = document.getElementById('txt-mins');
          const elSecs = document.getElementById('txt-secs');
          const elDate = document.getElementById('txt-date');

          if (elHrs) elHrs.textContent = hrs;
          if (elMins) elMins.textContent = mins;
          if (elSecs) elSecs.textContent = secs;

          if (elDate) {
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            elDate.textContent = yyyy + ' . ' + mm + ' . ' + dd;
          }
        }

        setInterval(update, 1000);
        update();
      })();
    
  </script>
</svg>
